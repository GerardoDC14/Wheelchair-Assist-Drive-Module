name: Repository quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-configuration:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Validate CubeMX manifest and repository structure
        run: python3 tools/repository_health.py
